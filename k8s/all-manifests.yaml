apiVersion: v1
kind: Namespace
metadata:
  name: examedge

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: examedge-config
  namespace: examedge
data:
  APP_NAME: "ExamEdge Pro"
  APP_ENV: "production"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres-service"
  DB_DATABASE: "examedge"
  REDIS_HOST: "redis-service"
  CACHE_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  ANTHROPIC_MODEL: "claude-sonnet-4-20250514"

---
apiVersion: v1
kind: Secret
metadata:
  name: examedge-secrets
  namespace: examedge
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  APP_KEY: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  ANTHROPIC_API_KEY: "sk-ant-CHANGE_ME"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: examedge
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 50Gi } }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: examedge
spec:
  serviceName: postgres-service
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: examedge }
            - { name: POSTGRES_USER, value: examedge }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: examedge-secrets, key: DB_PASSWORD } }
          volumeMounts: [{ name: postgres-data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { memory: "512Mi", cpu: "250m" }, limits: { memory: "2Gi", cpu: "1000m" } }
      volumes: [{ name: postgres-data, persistentVolumeClaim: { claimName: postgres-pvc } }]

---
apiVersion: v1
kind: Service
metadata: { name: postgres-service, namespace: examedge }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
  clusterIP: None

---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: examedge }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server","--appendonly","yes"]
          ports: [{ containerPort: 6379 }]
          resources: { requests: { memory: "128Mi", cpu: "100m" }, limits: { memory: "512Mi", cpu: "500m" } }

---
apiVersion: v1
kind: Service
metadata: { name: redis-service, namespace: examedge }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examedge-backend
  namespace: examedge
spec:
  replicas: 3
  selector: { matchLabels: { app: examedge-backend } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: examedge-backend } }
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/examedge-pro/backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: examedge-config }
            - secretRef: { name: examedge-secrets }
          resources: { requests: { memory: "256Mi", cpu: "250m" }, limits: { memory: "1Gi", cpu: "1000m" } }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 8000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 30 }

---
apiVersion: v1
kind: Service
metadata: { name: backend-service, namespace: examedge }
spec:
  selector: { app: examedge-backend }
  ports: [{ port: 8000, targetPort: 8000 }]

---
apiVersion: apps/v1
kind: Deployment
metadata: { name: examedge-horizon, namespace: examedge }
spec:
  replicas: 2
  selector: { matchLabels: { app: examedge-horizon } }
  template:
    metadata: { labels: { app: examedge-horizon } }
    spec:
      containers:
        - name: horizon
          image: ghcr.io/your-org/examedge-pro/backend:latest
          command: ["php","artisan","horizon"]
          envFrom:
            - configMapRef: { name: examedge-config }
            - secretRef: { name: examedge-secrets }
          resources: { requests: { memory: "256Mi", cpu: "250m" }, limits: { memory: "1Gi", cpu: "1000m" } }

---
apiVersion: apps/v1
kind: Deployment
metadata: { name: examedge-reverb, namespace: examedge }
spec:
  replicas: 2
  selector: { matchLabels: { app: examedge-reverb } }
  template:
    metadata: { labels: { app: examedge-reverb } }
    spec:
      containers:
        - name: reverb
          image: ghcr.io/your-org/examedge-pro/backend:latest
          command: ["php","artisan","reverb:start","--host=0.0.0.0","--port=8080"]
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: examedge-config }
            - secretRef: { name: examedge-secrets }

---
apiVersion: v1
kind: Service
metadata: { name: reverb-service, namespace: examedge }
spec:
  selector: { app: examedge-reverb }
  ports: [{ port: 8080, targetPort: 8080 }]

---
apiVersion: apps/v1
kind: Deployment
metadata: { name: examedge-frontend, namespace: examedge }
spec:
  replicas: 2
  selector: { matchLabels: { app: examedge-frontend } }
  template:
    metadata: { labels: { app: examedge-frontend } }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/examedge-pro/frontend:latest
          ports: [{ containerPort: 80 }]
          resources: { requests: { memory: "64Mi", cpu: "50m" }, limits: { memory: "128Mi", cpu: "200m" } }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5, periodSeconds: 5 }

---
apiVersion: v1
kind: Service
metadata: { name: frontend-service, namespace: examedge }
spec:
  selector: { app: examedge-frontend }
  ports: [{ port: 80, targetPort: 80 }]

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: examedge-ingress
  namespace: examedge
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts: [examedge.yourdomain.com, app.examedge.yourdomain.com]
      secretName: examedge-tls
  rules:
    - host: examedge.yourdomain.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend: { service: { name: backend-service, port: { number: 8000 } } }
          - path: /app/
            pathType: Prefix
            backend: { service: { name: reverb-service, port: { number: 8080 } } }
    - host: app.examedge.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend-service, port: { number: 80 } } }

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend-hpa, namespace: examedge }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: examedge-backend }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: horizon-hpa, namespace: examedge }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: examedge-horizon }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 75 } }
