version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-examedge}
      POSTGRES_USER: ${DB_USERNAME:-examedge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ${DB_USERNAME:-examedge}"],interval: 10s,retries: 5}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret}
    volumes: [redis_data:/data]
    ports: ["6379:6379"]

  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    restart: unless-stopped
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [backend]

  horizon:
    build: {context: ./backend, dockerfile: Dockerfile}
    working_dir: /var/www/html
    restart: unless-stopped
    env_file: .env
    command: php artisan horizon
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  reverb:
    build: {context: ./backend, dockerfile: Dockerfile}
    working_dir: /var/www/html
    restart: unless-stopped
    env_file: .env
    ports: ["8080:8080"]
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

volumes: {postgres_data: {}, redis_data: {}}
